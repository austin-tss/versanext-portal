<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>Sign in · VersaNext</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f6f9;color:#0d1117}
header{background:#000;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid;border-image:linear-gradient(90deg,#0b4fb3,#1e88ff,#6fd0ff) 1}

main{max-width:1000px;margin:28px auto;padding:0 20px}.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:20px}

<header><img src="logo.png" alt="VNXT"></header>

<main><div class=card style="max-width:420px;margin:40px auto"><h1>Employee Portal</h1><p class=tag>Versatile technology solutions to take your organization to the <b>next level.</b></p>
<p id=err style="color:#c62828"></p><form id=f><label>Username</label><input type=text name=u autocomplete=username required><label>Password</label><input type=password name=p autocomplete=current-password required><button class=btn style="width:100%">Sign in</button></form></div></main><footer><b>VersaNext</b> · Versatile technology solutions to take your organization to the next level.<br>A division of Tech Sourced Solutions</footer><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const u=e.target.u.value.trim().toLowerCase().replace(/\s+/g,' ');
const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+'|'+e.target.p.value));const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
if(h==='76a1bbb21e1356dd39db6b7477ef1f8bc2da9c510abae68ceacccf5f2cf01db4'){sessionStorage.setItem('vnxt',u);location.href='my-commission.html';}else document.getElementById('err').textContent='Incorrect username or password.';};</script></body></html>
